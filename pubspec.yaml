name: daily_duas
description: "Daily Duas - recite your daily duas and adhkar with alarms, audio and a guided counter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audio_session: ^0.2.4
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_tts: ^4.2.5
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^13.3.1
  sqflite: ^2.4.4+1
  timezone: ^0.11.1
  url_launcher: ^6.3.3
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/quran/
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
